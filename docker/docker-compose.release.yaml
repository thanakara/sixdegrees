services:
  flask:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "5000:5000"
    environment:
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_BOLT_BROWSER_URI: ${NEO4J_BOLT_BROWSER_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_DATABASE: ${NEO4J_DATABASE}
      FLASK_ENV: production
      DEBUG: "false"
    restart: unless-stopped
