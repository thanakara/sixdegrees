[tasks.clean]
help = "Remove all cache and generated files"
script = "poethepoet.scripts:rm('./**/__pycache__', './**/*.pyc', './**/*.pyo')"

[tasks.lint]
help = "Run ruff linter with diff (pass directory/file as arg)"
cmd = "ruff check ${path} --diff"
args = [{ name = "path", default = ".", positional = true, multiple = true }]

[tasks.format]
help = "Check formatting with diff (pass directory/file as arg)"
cmd = "ruff format ${path} --check --diff"
args = [{ name = "path", default = ".", positional = true, multiple = true }]

[tasks.dvc_remote]
help = "Configure DVC Google Drive remote with OAuth credentials"
envfile = ".env"
env = { "STORAGE" = "sixdegrees-store" }
sequence = [
    "dvc remote add --local -d ${STORAGE} gdrive://${FOLDER_ID}",
    "dvc remote modify --local ${STORAGE} gdrive_use_service_account true",
    "dvc remote modify --local ${STORAGE} gdrive_service_account_json_file_path ${JSONFILE_PATH}",
]
default_item_type = "cmd"
executor = { type = "uv", with = ["dvc[gdrive]"], isolated = true }

[tasks._compose_up]
cwd = "docker"
cmd = "docker compose --env-file=../.env up -d --build"

[tasks.start]
help = "Pull data from DVC remote and start all Docker services"
sequence = [
    { cmd = "dvc pull", executor = { type = "uv", with = [
        "dvc[gdrive]",
    ], isolated = true } },
    "_compose_up",
]

[tasks.stop]
help = "Stop all services and remove volumes"
cwd = "docker"
cmd = "docker compose --env-file=../.env down -v"

# Aura
[tasks._build_migrations]
cmd = "docker build -q -f docker/Dockerfile.migrations docker/ -t sixdegrees-migrations"

[tasks.migrate_aura]
help = "Run migrations against Aura"
envfile = ".env"
sequence = [
    "_build_migrations",
    { cmd = "docker run --rm sixdegrees-migrations --address ${NEO4J_URI} --username ${NEO4J_USER} --password ${NEO4J_PASSWORD} --location file:///migrations migrate" },
]

[tasks.seed]
help = "Seed the Neo4j database"
envfile = ".env"
cmd = "python -m sixdegrees.ingest.seeder"
executor = { type = "uv" }

[tasks.release_start]
help = "Start Flask only, connecting to Aura"
envfile = ".env"
cwd = "docker"
cmd = "docker compose -f docker-compose.release.yaml --env-file ../.env up -d --build"


[tasks.release_stop]
help = "Stop release services"
envfile = ".env"
cwd = "docker"
cmd = "docker compose -f docker-compose.release.yaml --env-file ../.env down"
